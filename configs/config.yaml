# Vishwas Configuration
# Skin-tone-aware skin disease classification with fairness auditing and retrieval-grounded explanations

project:
  name: "vishwas"
  version: "0.2.0"
  seed: 42
  device: "mps"  # auto-detected: "mps" if available on Apple Silicon, else "cpu"

dataset: "milk10k"  # "milk10k" | "dermamnist" | "fitzpatrick" | "pad_ufes"

# Skin tone grouping configuration: {0,1,2} -> G1, {3} -> G2, {4,5} -> G3, missing -> unknown
tone_groups:
  0: "G1"
  1: "G1"
  2: "G1"
  3: "G2"
  4: "G3"
  5: "G3"
  "missing": "unknown"

data:
  # MILK10k configurations
  milk10k_dir: "data/milk10k"
  milk10k_folds_csv: "data/milk10k_folds.csv"
  n_folds: 5
  seed: 42
  min_cell_size: 10

  # DermaMNIST configurations
  resolution: 28  # 28 | 224
  dermamnist_28_path: "DermaMNIST/DermaMNIST_Analysis/NPZ_files/dermamnist_corrected_28.npz"
  dermamnist_224_dir: "~/.medmnist"

  # Fitzpatrick configurations
  split_csv: "Fitzpatrick17k/Fitzpatrick17k_Analysis/DatasetSplits/SimThresh_T_A2_T_0.99_0.70_FC_T_KeepOne_Out_T_OutThresh_None_0FST_F.csv"
  orig_metadata_csv: "data/fitzpatrick17k.csv"
  image_dir: "data/fitzpatrick_images"
  clean_metadata_csv: "data/metadata_clean.csv"
  failed_downloads_csv: "data/failed_downloads.csv"
  ita_csv: "data/ita.csv"

preprocess:
  augmentation: "standard"  # "standard" | "colour_preserving"
  target_col: "nine_partition_label"  # Fitzpatrick: "nine_partition_label" | "three_partition_label" | "label"
  img_size: 224       # For Fitzpatrick or 224x224 DermaMNIST
  upscale_size: 64    # For 28x28 DermaMNIST data upscaling (64 or 128)
  num_workers: 2

models:
  backbone: "resnet18"  # "resnet18" | "efficientnet_b0" | "resnet50"
  model_type: "image_only"  # "image_only" | "fusion" | "gated_fusion"
  pretrained: true
  dropout: 0.2

train:
  batch_size: 32
  epochs: 12
  lr_encoder: 0.0001        # 1e-4 for pretrained encoders
  lr_head: 0.001            # 1e-3 for classification & fusion head
  lr: 0.0003                # default fallback
  weight_decay: 0.01        # 1e-2
  label_smoothing: 0.05     # 0.05 cross-entropy label smoothing
  warmup_epochs: 1          # 1 epoch linear warmup then cosine decay
  patience: 4               # early stopping patience
  min_val_samples_per_class: 5  # minimum samples per class in val slice for early stopping metric
  mitigation: "class_weighted"  # "none" | "class_weighted" | "balanced_sampler" | "group_weighted"
  class_weight_cap: 10.0    # cap class weights at 10 so MAL_OTH does not dominate
  mixed_precision: true

rag:
  knowledge_dir: "vishwas/knowledge"
  index_path: "vishwas/knowledge/faiss_index"
  embedding_model: "BAAI/bge-small-en-v1.5"
  chunk_size: 500
  chunk_overlap: 80
  top_k: 3
  confidence_threshold: 0.60
  min_retrieval_score: 0.40

reports:
  output_dir: "vishwas/reports"
  experiments_log: "vishwas/reports/experiments.csv"
